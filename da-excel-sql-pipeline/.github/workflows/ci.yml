name: Data Quality Pipeline (Python)

on:
  push:
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: da-excel-sql-pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run demo pipeline (expected data-quality failure)
        run: |
          set +e
          python -m dq_pipeline run --excel examples/ventas_demo.xlsx --sheet Ventas --table ventas --key id_venta
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected demo to return 1 for intentional duplicate-key failure; got $status"
            exit 1
          fi
          grep -q "## Result: FAIL" outputs/report.md
          test -s outputs/cleaned.xlsx
          test -s outputs/rules_results.csv

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: outputs
